<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHAHRIYAR LIVE TV - Web Player</title>
    <link rel="shortcut icon" type="image/x-icon" href="https://blogger.googleusercontent.com/img/a/AVvXsEjz0o_rUO-ESkNHIPrS97j51IBvyY35Z8GmEmmDOLQtRmErsvwvDka4XGmqpDlcDy6iNkfo3mc-ApousuAR4mrZoFlGYeBSO6HKxnlM62ODaMOAhOIAzXp34Q5pO39RV6UIKS-WjKFLh6tLB3KLHxqTivKYmRTdnZEmm9xUZw5tFeZ5YakHpd0jF3DU">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --primary-color: #00b3ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --hover-bg: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* ------------------ Sidebar (Channel List) ------------------ */
        .sidebar { width: 320px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; border-right: 1px solid #334155; z-index: 100;}
        .header { padding: 20px; text-align: center; background: #0b1120; border-bottom: 2px solid var(--primary-color); }
        .header h1 { font-size: 20px; font-weight: bold; color: var(--text-main); }
        .header span { color: var(--primary-color); }
        
        .search-box { padding: 10px; background: #0b1120; }
        .search-box input { width: 100%; padding: 10px; border-radius: 5px; border: none; background: #1e293b; color: white; outline: none; }
        
        .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
        .category-title { font-size: 14px; color: var(--primary-color); text-transform: uppercase; margin: 15px 10px 5px; font-weight: bold; border-bottom: 1px solid var(--hover-bg); padding-bottom: 5px; }
        
        .channel-item { display: flex; align-items: center; padding: 10px; cursor: pointer; border-radius: 8px; transition: background 0.2s; margin-bottom: 5px; }
        .channel-item:hover, .channel-item.active { background-color: var(--hover-bg); }
        .channel-item.active { border-left: 4px solid var(--primary-color); }
        .channel-logo { width: 40px; height: 40px; border-radius: 5px; object-fit: contain; margin-right: 15px; background: #fff; padding: 2px; }
        .channel-name { font-size: 14px; font-weight: 500; }

        /* ------------------ Main Content (Player) ------------------ */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative;}
        
        /* Loading Animation inside Player */
        .loading {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 99; /* Below Plyr controls but above video */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loading-text span {
            display: inline-block; margin: 0 5px; color: #00b3ff; font-size: 24px; font-weight: bold;
        }
        .loading-text span:nth-child(1) { animation: blur-text 0.8s 0s infinite linear alternate; }
        .loading-text span:nth-child(2) { animation: blur-text 0.8s 0.1s infinite linear alternate; }
        .loading-text span:nth-child(3) { animation: blur-text 0.8s 0.2s infinite linear alternate; }
        .loading-text span:nth-child(4) { animation: blur-text 0.8s 0.3s infinite linear alternate; }
        .loading-text span:nth-child(5) { animation: blur-text 0.8s 0.4s infinite linear alternate; }
        .loading-text span:nth-child(6) { animation: blur-text 0.8s 0.5s infinite linear alternate; }
        .loading-text span:nth-child(7) { animation: blur-text 0.8s 0.6s infinite linear alternate; }
        .loading-text span:nth-child(8) { animation: blur-text 0.8s 0.7s infinite linear alternate; }
        .loading-text span:nth-child(9) { animation: blur-text 0.8s 0.8s infinite linear alternate; }

        @keyframes blur-text {
            0% { filter: blur(0px); }
            100% { filter: blur(4px); }
        }

        .player-wrapper { flex: 1; background-color: #000; position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;}
        
        /* Plyr Customization & Branding Watermark */
        .plyr { width: 100%; height: 100%; }
        .plyr__video-wrapper::before {
            position: absolute; top: 10px; right: 10px; z-index: 10; content: ''; height: 40px; width: 40px;
            background: url('https://blogger.googleusercontent.com/img/a/AVvXsEjz0o_rUO-ESkNHIPrS97j51IBvyY35Z8GmEmmDOLQtRmErsvwvDka4XGmqpDlcDy6iNkfo3mc-ApousuAR4mrZoFlGYeBSO6HKxnlM62ODaMOAhOIAzXp34Q5pO39RV6UIKS-WjKFLh6tLB3KLHxqTivKYmRTdnZEmm9xUZw5tFeZ5YakHpd0jF3DU') no-repeat;
            background-size: contain; opacity: 0.8;
        }

        /* ------------------ Footer / Now Playing ------------------ */
        .footer { padding: 15px; background-color: var(--sidebar-bg); display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #334155; }
        .now-playing { display: flex; align-items: center; }
        .now-playing img { width: 50px; height: 50px; border-radius: 8px; margin-right: 15px; object-fit: contain; background: #fff; }
        .now-playing-info h2 { font-size: 18px; margin-bottom: 2px; }
        .now-playing-info p { color: var(--text-muted); font-size: 12px; }
        .copyright { font-size: 12px; color: var(--text-muted); text-align: right; }
        .copyright a { color: var(--primary-color); text-decoration: none; }

        /* ------------------ Mobile Responsive ------------------ */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 50vh; order: 2; border-right: none; border-top: 1px solid #334155; }
            .main-content { height: 50vh; order: 1; }
            .footer { flex-direction: column; text-align: center; gap: 10px; }
            .copyright { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="header">
            <h1>SHAHRIYAR <span>LIVE TV</span></h1>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Search Channels..." onkeyup="searchChannels()">
        </div>
        <div class="channel-list" id="channelList">
            <div style="text-align:center; padding:20px; color: #94a3b8;">Loading channels...</div>
        </div>
    </div>

    <div class="main-content">
        <div class="player-wrapper" id="playerContainer">
            
            <div id="loading" class="loading">
                <div class="loading-text">
                    <span>S</span><span>H</span><span>A</span><span>H</span><span>R</span><span>I</span><span>Y</span><span>A</span><span>R</span>
                </div>
            </div>

            <video id="player" controls crossorigin playsinline>
                <source src="https://cdn.plyr.io/static/blank.mp4" type="video/mp4" />
            </video>
        </div>
        
        <div class="footer">
            <div class="now-playing" id="nowPlayingSection" style="visibility: hidden;">
                <img id="npLogo" src="" alt="Logo">
                <div class="now-playing-info">
                    <h2 id="npName">Select a channel</h2>
                    <p id="npCategory">Category</p>
                </div>
            </div>
            <div class="copyright">
                &copy; <span id="year"></span> | Developed by <br>
                <a href="https://t.me/shahriyartvbot" target="_blank">SHAHRIYAR SOJIB HASAN</a>
            </div>
        </div>
    </div>

    <script>
        // Set Current Year dynamically
        document.getElementById('year').innerText = new Date().getFullYear();

        // ------------------ Player Setup ------------------
        const videoElement = document.getElementById('player');
        const loadingOverlay = document.getElementById('loading');
        
        // Initialize Plyr Custom Controls
        const player = new Plyr(videoElement, {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
            quality: { default: 720, options: [1080, 720, 480, 360] }
        });

        let hlsInstance = null;

        // Play Stream Function (Handles HLS, MP4 etc)
        function playStream(url, channelName, channelLogo, channelCategory) {
            // Show Animation
            loadingOverlay.style.display = 'flex';
            
            // Update UI
            document.getElementById('nowPlayingSection').style.visibility = 'visible';
            document.getElementById('npName').innerText = channelName;
            document.getElementById('npCategory').innerText = channelCategory;
            document.getElementById('npLogo').src = channelLogo;

            // Destroy previous HLS instance if exists
            if (hlsInstance) { hlsInstance.destroy(); }

            if (url.includes('.m3u8') || url.includes('.m3u')) {
                // Play HLS
                if (Hls.isSupported()) {
                    hlsInstance = new Hls({ maxMaxBufferLength: 100 });
                    hlsInstance.loadSource(url);
                    hlsInstance.attachMedia(videoElement);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
                        setTimeout(() => { loadingOverlay.style.display = 'none'; }, 800); // Hide animation fast
                        player.play();
                    });
                    hlsInstance.on(Hls.Events.ERROR, function(e, data) {
                        if (data.fatal) { alert("Source Offline or Unplayable!"); loadingOverlay.style.display = 'none'; }
                    });
                } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                    // For Safari
                    videoElement.src = url;
                    videoElement.addEventListener('loadedmetadata', function() {
                        setTimeout(() => { loadingOverlay.style.display = 'none'; }, 800);
                        player.play();
                    });
                }
            } else {
                // Play Native MP4/WebM
                videoElement.src = url;
                videoElement.addEventListener('loadeddata', function() {
                    setTimeout(() => { loadingOverlay.style.display = 'none'; }, 800);
                    player.play();
                });
            }
        }

        // ------------------ M3U Fetching & Parsing ------------------
        const M3U_URL = 'SHAHRIYAR-LIVE-TV.m3u'; 
        let allChannels = [];

        async function fetchAndParseM3U() {
            try {
                // Cache buster for realtime sync
                const response = await fetch(`${M3U_URL}?t=${new Date().getTime()}`); 
                const data = await response.text();
                
                const lines = data.split('\n');
                let currentChannel = {};

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        const nameMatch = line.split(',');
                        currentChannel.name = nameMatch.length > 1 ? nameMatch[1].trim().replace(' | SHAHRIYAR LIVE TV', '') : 'Unknown';
                        
                        const logoMatch = line.match(/tvg-logo="(.*?)"/);
                        currentChannel.logo = logoMatch && logoMatch[1] ? logoMatch[1] : 'https://via.placeholder.com/150/ffffff/000000?text=TV';
                        
                        const groupMatch = line.match(/group-title="(.*?)"/);
                        currentChannel.group = groupMatch && groupMatch[1] ? groupMatch[1] : 'Uncategorized';
                    } else if (line.startsWith('http')) {
                        currentChannel.url = line;
                        allChannels.push(currentChannel);
                        currentChannel = {};
                    }
                }
                renderChannels(allChannels);
            } catch (error) {
                document.getElementById('channelList').innerHTML = '<div style="color:red; text-align:center;">Failed to sync live data!</div>';
            }
        }

        // ------------------ Render Sidebar ------------------
        function renderChannels(channelsToRender) {
            const listContainer = document.getElementById('channelList');
            listContainer.innerHTML = '';

            if(channelsToRender.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; color:#94a3b8; padding: 20px;">No channels found!</div>';
                return;
            }

            const grouped = channelsToRender.reduce((acc, channel) => {
                if (!acc[channel.group]) acc[channel.group] = [];
                acc[channel.group].push(channel);
                return acc;
            }, {});

            const groups = Object.keys(grouped).sort((a, b) => {
                if (a.toLowerCase() === 'promo') return -1;
                return a.localeCompare(b);
            });

            groups.forEach(group => {
                const catDiv = document.createElement('div');
                catDiv.className = 'category-title';
                catDiv.textContent = group;
                listContainer.appendChild(catDiv);

                grouped[group].forEach(channel => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.innerHTML = `
                        <img src="${channel.logo}" class="channel-logo" onerror="this.src='https://via.placeholder.com/150/ffffff/000000?text=TV'">
                        <div class="channel-name">${channel.name}</div>
                    `;
                    item.onclick = () => {
                        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                        item.classList.add('active');
                        playStream(channel.url, channel.name, channel.logo, channel.group);
                    };
                    listContainer.appendChild(item);
                });
            });

            // Hide initial loading animation after sidebar loads
            setTimeout(() => { loadingOverlay.style.display = 'none'; }, 1500);
        }

        // Search Function
        function searchChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allChannels.filter(c => c.name.toLowerCase().includes(query) || c.group.toLowerCase().includes(query));
            renderChannels(filtered);
        }

        // Init
        window.onload = fetchAndParseM3U;
    </script>
</body>
</html>
