<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>SHAHRIYAR LIVE TV | 100% Verified Playable Streams</title>
    <meta name="description" content="Super fast, lightweight, and policy-compliant live TV web player featuring verified public broadcasts with intelligent CORS & stream proxy fallback.">
    <meta name="theme-color" content="#0b1121">
    
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" type="image/png" href="https://blogger.googleusercontent.com/img/a/AVvXsEjz0o_rUO-ESkNHIPrS97j51IBvyY35Z8GmEmmDOLQtRmErsvwvDka4XGmqpDlcDy6iNkfo3mc-ApousuAR4mrZoFlGYeBSO6HKxnlM62ODaMOAhOIAzXp34Q5pO39RV6UIKS-WjKFLh6tLB3KLHxqTivKYmRTdnZEmm9xUZw5tFeZ5YakHpd0jF3DU">
    
    <!-- Ultra-lightweight Hls.js (~90KB, loads asynchronously) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>

    <style>
        :root {
            --bg-dark: #070d18;
            --panel-bg: #0f172a;
            --sidebar-bg: #0c1427;
            --accent-blue: #00b4d8;
            --accent-glow: rgba(0, 180, 216, 0.35);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-dim: #64748b;
            --border: #1e293b;
            --hover-item: #1e293b;
            --card-active: rgba(0, 180, 216, 0.12);
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-primary);
        }

        .app-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* ----------------- SIDEBAR ----------------- */
        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100%;
            z-index: 50;
        }

        .brand-header {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(12, 20, 39, 0.95);
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand-logo {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            object-fit: cover;
        }

        .brand-title span { color: var(--accent-blue); }

        .channel-badge {
            background: rgba(0, 180, 216, 0.15);
            color: var(--accent-blue);
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid var(--accent-glow);
        }

        .search-container {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--sidebar-bg);
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 10px;
            font-size: 13px;
            color: var(--text-dim);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px 8px 30px;
            background: #131d33;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        /* Filter Chips */
        .category-tabs {
            display: flex;
            gap: 6px;
            padding: 8px 14px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            scrollbar-width: none;
        }
        .category-tabs::-webkit-scrollbar { display: none; }

        .cat-chip {
            background: #131d33;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-chip:hover { color: var(--text-primary); border-color: var(--text-dim); }
        .cat-chip.active {
            background: var(--accent-blue);
            color: #070d18;
            border-color: var(--accent-blue);
            font-weight: 700;
        }

        /* Channel List */
        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            scroll-behavior: smooth;
        }

        .channel-list::-webkit-scrollbar { width: 5px; }
        .channel-list::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }

        .group-header {
            font-size: 10.5px;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 10px 8px 4px;
        }

        .channel-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            margin-bottom: 3px;
            user-select: none;
            border: 1px solid transparent;
        }

        .channel-card:hover {
            background: var(--hover-item);
        }

        .channel-card.active {
            background: var(--card-active);
            border-color: rgba(0, 180, 216, 0.4);
        }

        .channel-logo-wrap {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .channel-card-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 2px;
        }

        .channel-card-info {
            flex: 1;
            min-width: 0;
        }

        .channel-card-name {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-card.active .channel-card-name {
            color: var(--accent-blue);
            font-weight: 700;
        }

        .channel-card-sub {
            font-size: 10px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 5px;
            height: 5px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
        }

        /* ----------------- PLAYER AREA ----------------- */
        .player-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            height: 100%;
            position: relative;
            min-width: 0;
        }

        .video-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Loading Spinner */
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 13, 24, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            gap: 12px;
            transition: opacity 0.25s;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(0, 180, 216, 0.2);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-blue);
            letter-spacing: 0.5px;
        }

        /* Custom Floating Player HUD Controls */
        .player-bar {
            padding: 10px 18px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-shrink: 0;
        }

        .now-playing-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .np-logo {
            width: 38px;
            height: 38px;
            border-radius: 6px;
            background: #1e293b;
            object-fit: contain;
            padding: 2px;
            flex-shrink: 0;
        }

        .np-details {
            min-width: 0;
            flex: 1;
        }

        .np-title {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .np-badge-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .badge-stream {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .badge-live {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-engine {
            background: rgba(0, 180, 216, 0.15);
            color: var(--accent-blue);
            border: 1px solid var(--accent-glow);
        }

        /* Player Action Buttons */
        .player-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-ctrl {
            background: #1e293b;
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 34px;
            height: 34px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-ctrl:hover {
            background: var(--hover-item);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        /* Toast Notifications */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: transform 0.25s, opacity 0.25s;
            pointer-events: none;
        }

        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        #toast.success { border-color: var(--success); color: var(--success); }
        #toast.error { border-color: var(--danger); color: var(--danger); }

        /* Policy Compliance Disclaimer */
        .policy-disclaimer {
            font-size: 10px;
            color: var(--text-dim);
            text-align: right;
            line-height: 1.3;
            max-width: 250px;
        }

        .policy-disclaimer a { color: var(--accent-blue); text-decoration: none; }

        /* Responsive Breakpoints */
        @media (max-width: 820px) {
            .app-layout {
                flex-direction: column;
            }

            .player-viewport {
                height: 40vh;
                min-height: 220px;
                flex: none;
            }

            .sidebar {
                width: 100%;
                flex: 1;
                border-right: none;
                border-top: 1px solid var(--border);
            }

            .policy-disclaimer { display: none; }
        }
    </style>
</head>
<body>

    <div id="toast"></div>

    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <header class="brand-header">
                <div class="brand-title">
                    <img src="https://blogger.googleusercontent.com/img/a/AVvXsEjz0o_rUO-ESkNHIPrS97j51IBvyY35Z8GmEmmDOLQtRmErsvwvDka4XGmqpDlcDy6iNkfo3mc-ApousuAR4mrZoFlGYeBSO6HKxnlM62ODaMOAhOIAzXp34Q5pO39RV6UIKS-WjKFLh6tLB3KLHxqTivKYmRTdnZEmm9xUZw5tFeZ5YakHpd0jF3DU" alt="Logo" class="brand-logo">
                    <div>SHAHRIYAR <span>LIVE TV</span></div>
                </div>
                <div class="channel-badge" id="totalCount">0 Channels</div>
            </header>

            <div class="search-container">
                <div class="search-input-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search channels..." oninput="filterChannels()">
                </div>
            </div>

            <!-- Category Filter Chips -->
            <div class="category-tabs" id="categoryChips">
                <button class="cat-chip active" onclick="selectCategory('ALL')">All</button>
                <button class="cat-chip" onclick="selectCategory('🇧🇩 BANGLADESH')">🇧🇩 Bangladesh</button>
                <button class="cat-chip" onclick="selectCategory('⚽ SPORTS')">⚽ Sports</button>
                <button class="cat-chip" onclick="selectCategory('📰 NEWS')">📰 News</button>
                <button class="cat-chip" onclick="selectCategory('🎬 ENTERTAINMENT')">🎬 Entertainment</button>
                <button class="cat-chip" onclick="selectCategory('🎵 MUSIC')">🎵 Music</button>
                <button class="cat-chip" onclick="selectCategory('👶 KIDS')">👶 Kids</button>
                <button class="cat-chip" onclick="selectCategory('🌍 DOCUMENTARY')">🌍 Docs</button>
            </div>

            <!-- Channel List -->
            <div class="channel-list" id="channelContainer">
                <div style="text-align:center; padding:30px 10px; color:var(--text-dim); font-size:12px;">
                    Loading verified live channels...
                </div>
            </div>
        </aside>

        <!-- Player Main Area -->
        <main class="player-viewport">
            <div class="video-container">
                <div id="loading" class="loading-screen" style="display: none;">
                    <div class="spinner"></div>
                    <div id="loadingMsg" class="loading-text">Connecting Stream...</div>
                </div>
                <video id="videoElement" controls autoplay playsinline preload="auto"></video>
            </div>

            <!-- Bottom HUD Bar -->
            <footer class="player-bar">
                <div class="now-playing-meta">
                    <img id="npLogo" src="" alt="Channel" class="np-logo" style="display: none;">
                    <div class="np-details">
                        <div id="npTitle" class="np-title">Select a channel to start watching</div>
                        <div class="np-badge-row">
                            <span class="badge-stream badge-live"><span class="live-dot"></span> LIVE</span>
                            <span id="npEngine" class="badge-stream badge-engine">DIRECT HLS</span>
                            <span id="npCategory" style="font-size:11px; color:var(--text-dim);">Public Broadcast</span>
                        </div>
                    </div>
                </div>

                <div class="player-actions">
                    <button class="btn-ctrl" title="Previous Channel (Up Arrow)" onclick="playPrevChannel()">⏮</button>
                    <button class="btn-ctrl" title="Next Channel (Down Arrow)" onclick="playNextChannel()">⏭</button>
                    <button class="btn-ctrl" title="Retry with Proxy" onclick="retryWithProxy()">🛡️</button>
                    <button class="btn-ctrl" title="Toggle Fullscreen (F)" onclick="toggleFullscreen()">⛶</button>
                </div>

                <div class="policy-disclaimer">
                    100% Policy-Compliant FTA Feeds.<br>
                    <a href="https://t.me/shahriyartvbot" target="_blank">Contact Telegram</a>
                </div>
            </footer>
        </main>
    </div>

    <script>
        // Configuration
        const M3U_PATH = 'SHAHRIYAR-LIVE-TV.m3u';
        const FALLBACK_LOGO = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="%2300b4d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>';
        
        // Dynamic Proxy determination (uses current origin if hosted on Node/Worker, or falls back to worker dev)
        const PROXY_BASE = window.location.origin.includes('http') && !window.location.origin.includes('file')
            ? `${window.location.origin}/proxy?url=`
            : 'https://stv.shahriyarsojibhasan.workers.dev/proxy?url=';

        let allChannels = [];
        let filteredChannels = [];
        let activeCategory = 'ALL';
        let currentIndex = -1;
        let hlsInstance = null;
        let usingProxy = false;
        let playTimeout = null;

        const video = document.getElementById('videoElement');
        const loading = document.getElementById('loading');
        const loadingMsg = document.getElementById('loadingMsg');

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `show ${type}`;
            setTimeout(() => { toast.className = ''; }, 2200);
        }

        function setScreenLoading(visible, msg = "Connecting Stream...") {
            loadingMsg.innerText = msg;
            loading.style.display = visible ? 'flex' : 'none';
        }

        // Clean destroy of existing HLS stream
        function resetPlayer() {
            if (playTimeout) clearTimeout(playTimeout);
            if (hlsInstance) {
                try { hlsInstance.destroy(); } catch(e) {}
                hlsInstance = null;
            }
            video.removeAttribute('src');
            video.load();
        }

        // Play stream engine
        function playChannel(index, forceProxy = false) {
            if (index < 0 || index >= allChannels.length) return;
            currentIndex = index;
            const channel = allChannels[index];
            usingProxy = forceProxy;

            // UI updates
            document.getElementById('npTitle').innerText = channel.name;
            const npLogo = document.getElementById('npLogo');
            npLogo.src = channel.logo || FALLBACK_LOGO;
            npLogo.style.display = 'block';
            document.getElementById('npCategory').innerText = channel.group;
            document.getElementById('npEngine').innerText = forceProxy ? '🛡️ PROXY PROTECTED' : '⚡ DIRECT HLS';

            highlightActiveCard(channel.id);
            resetPlayer();
            setScreenLoading(true, forceProxy ? "Connecting via Safe Edge Proxy..." : "Loading Live Stream...");

            // Determine playback target
            let streamUrl = channel.url;
            if (forceProxy || (!streamUrl.startsWith('https://') && window.location.protocol === 'https:')) {
                streamUrl = PROXY_BASE + encodeURIComponent(channel.url);
                document.getElementById('npEngine').innerText = '🛡️ PROXY PROTECTED';
            }

            if (Hls.isSupported()) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 60,
                    maxBufferLength: 30,
                    manifestLoadingTimeOut: 8000,
                    manifestLoadingMaxRetry: 2
                });

                hlsInstance.loadSource(streamUrl);
                hlsInstance.attachMedia(video);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    setScreenLoading(false);
                    video.play().catch(() => {});
                });

                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.warn("HLS Error:", data.type, data.details);
                        if (!usingProxy) {
                            showToast("⚠️ Stream restricted. Auto-switching to Safe Proxy...", "info");
                            playChannel(currentIndex, true);
                        } else {
                            setScreenLoading(false);
                            showToast("❌ Stream currently unavailable", "error");
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Native Safari
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => {
                    setScreenLoading(false);
                    video.play().catch(() => {});
                }, { once: true });
                video.addEventListener('error', () => {
                    if (!usingProxy) playChannel(currentIndex, true);
                }, { once: true });
            }
        }

        function retryWithProxy() {
            if (currentIndex >= 0) {
                showToast("Switching to Edge Proxy...", "info");
                playChannel(currentIndex, true);
            }
        }

        function playNextChannel() {
            if (allChannels.length === 0) return;
            const nextIdx = (currentIndex + 1) % allChannels.length;
            playChannel(nextIdx, false);
        }

        function playPrevChannel() {
            if (allChannels.length === 0) return;
            const prevIdx = (currentIndex - 1 + allChannels.length) % allChannels.length;
            playChannel(prevIdx, false);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        // Highlight active card & scroll into view smoothly
        function highlightActiveCard(id) {
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            const card = document.querySelector(`.channel-card[data-id="${id}"]`);
            if (card) {
                card.classList.add('active');
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // Load & Parse M3U
        async function loadPlaylist() {
            try {
                const res = await fetch(`${M3U_PATH}?v=${Date.now()}`);
                if (!res.ok) throw new Error('Failed to fetch M3U');
                const text = await res.text();

                allChannels = [];
                let current = {};
                let idCounter = 1;

                text.split('\n').forEach(line => {
                    line = line.trim();
                    if (!line) return;

                    if (line.startsWith('#EXTINF:')) {
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        const groupMatch = line.match(/group-title="([^"]+)"/);
                        const nameIdx = line.lastIndexOf(',');
                        
                        current.name = nameIdx !== -1 ? line.substring(nameIdx + 1).trim() : 'Live Channel';
                        current.logo = logoMatch ? logoMatch[1] : '';
                        current.group = groupMatch ? groupMatch[1] : '🌐 WORLD TV';
                    } else if (line.startsWith('http') && current.name) {
                        current.url = line.split('|')[0].trim();
                        current.id = `CH_${idCounter++}`;
                        allChannels.push(current);
                        current = {};
                    }
                });

                document.getElementById('totalCount').innerText = `${allChannels.length} Channels`;
                renderChannels();

                // Auto-play first available channel or URL param
                if (allChannels.length > 0) {
                    playChannel(0, false);
                }

            } catch (err) {
                console.error(err);
                document.getElementById('channelContainer').innerHTML = `
                    <div style="text-align:center; padding:30px 10px; color:var(--danger); font-size:12px;">
                        ⚠️ Unable to load channels.<br>Please run python generator script.
                    </div>`;
            }
        }

        // Render Channel DOM
        function renderChannels() {
            const container = document.getElementById('channelContainer');
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            filteredChannels = allChannels.filter(c => {
                const matchCategory = activeCategory === 'ALL' || c.group.toUpperCase() === activeCategory.toUpperCase();
                const matchQuery = !query || c.name.toLowerCase().includes(query) || c.group.toLowerCase().includes(query);
                return matchCategory && matchQuery;
            });

            if (filteredChannels.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:30px 10px; color:var(--text-dim); font-size:12px;">No channels found matching "${query}"</div>`;
                return;
            }

            // Group by category
            const grouped = {};
            filteredChannels.forEach(c => {
                if (!grouped[c.group]) grouped[c.group] = [];
                grouped[c.group].push(c);
            });

            let html = '';
            for (const [group, channels] of Object.entries(grouped)) {
                html += `<div class="group-header">${group} (${channels.length})</div>`;
                channels.forEach(ch => {
                    const originalIndex = allChannels.findIndex(x => x.id === ch.id);
                    const isActive = originalIndex === currentIndex ? 'active' : '';
                    const logoSrc = ch.logo ? ch.logo : FALLBACK_LOGO;

                    html += `
                        <div class="channel-card ${isActive}" data-id="${ch.id}" onclick="playChannel(${originalIndex}, false)">
                            <div class="channel-logo-wrap">
                                <img src="${logoSrc}" class="channel-card-logo" onerror="this.src='${FALLBACK_LOGO}'" loading="lazy">
                            </div>
                            <div class="channel-card-info">
                                <div class="channel-card-name">${ch.name}</div>
                                <div class="channel-card-sub"><span class="live-dot"></span> Verified Live</div>
                            </div>
                        </div>
                    `;
                });
            }

            container.innerHTML = html;
        }

        // Category Filter
        function selectCategory(category) {
            activeCategory = category;
            document.querySelectorAll('.cat-chip').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(category) || (category === 'ALL' && btn.innerText === 'All'));
            });
            renderChannels();
        }

        function filterChannels() {
            renderChannels();
        }

        // Keyboard navigation (TV Remote & Desktop)
        document.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;
            if (e.key === 'ArrowUp') { e.preventDefault(); playPrevChannel(); }
            else if (e.key === 'ArrowDown') { e.preventDefault(); playNextChannel(); }
            else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); }
            else if (e.key === ' ') { e.preventDefault(); video.paused ? video.play() : video.pause(); }
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', loadPlaylist);
    </script>
</body>
</html>
